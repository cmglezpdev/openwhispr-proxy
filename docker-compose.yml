services:
  openwhispr-proxy:
    build: .
    labels:
      dev.orbstack.compose-icon: 'https://raw.githubusercontent.com/cmglezpdev/openwhispr-proxy/main/assets/orbstack-icon.png'
    environment:
      PORT: ${PORT:-8080}
      USAGE_DB_PATH: ${USAGE_DB_PATH:-}
    ports:
      - '${PORT:-8080}:${PORT:-8080}'
    volumes:
      - ./data:/app/data
    restart: unless-stopped
