name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  application:
    name: Application / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check shared application version
        run: pnpm check:version
      - name: Lint server and dashboard
        run: |
          pnpm lint:check
          pnpm lint:dashboard
      - name: Test server, HTTP integration and dashboard
        run: pnpm test:all
      - name: Build application
        run: pnpm build

  release-please:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: application
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # GITHUB_TOKEN does not trigger pull_request workflows. An explicit
      # workflow_dispatch runs the same checks on the generated release branch.
      - name: Run CI on release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          pr_number=$(jq -er '.number' <<< "$RELEASE_PR")
          branch=$(gh api "repos/$GH_REPO/pulls/$pr_number" --jq '.head.ref')
          gh workflow run release-please.yml --ref "$branch"
